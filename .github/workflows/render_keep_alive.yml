name: Keep Render Backend Awake 24/7

on:
  schedule:
    # Runs every 10 minutes (prevents Render's 15-minute inactivity spin-down)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render Backend
        run: |
          TARGET_URL="${{ secrets.RENDER_API_URL || vars.RENDER_API_URL || 'https://geovigilant-argus-api.onrender.com' }}"
          HEALTH_URL="${TARGET_URL%/}/health"
          echo "============================================================"
          echo "🚀 Pinging Render backend at: $HEALTH_URL"
          echo "⏰ Timestamp: $(date -u)"
          echo "============================================================"

          # Ping with up to 2 retries and a 45s timeout to handle initial wakes
          HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" --max-time 45 --retry 2 --retry-delay 5 "$HEALTH_URL" || echo "000")

          echo "Response HTTP Status: $HTTP_CODE"
          if [ -f /tmp/health_response.json ]; then
            echo "Response Body: $(cat /tmp/health_response.json)"
          fi

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Render backend is ONLINE and AWAKE."
          else
            echo "⚠️ Non-200 response or initial bootup. Ping sent successfully."
          fi
